[workspace]
resolver = "2"
members = [
    "crates/llmpager-core",
    "crates/llmpager-cuda",
    "crates/llmpager-convert",
    "crates/llmpager-bench",
    "crates/llmpager-run",
    "crates/llmpager-serve",
]
# llmpager-run/-serve need nvcc (kernels feature); keep default builds/tests
# working on machines without the CUDA toolchain.
default-members = [
    "crates/llmpager-core",
    "crates/llmpager-cuda",
    "crates/llmpager-convert",
    "crates/llmpager-bench",
]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/glennswest/llmpager"

[workspace.dependencies]
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
