[workspace]
resolver = "2"
members = [
    "crates/llmpager-core",
    "crates/llmpager-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/glennswest/llmpager"

[workspace.dependencies]
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
