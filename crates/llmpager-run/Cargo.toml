[package]
name = "llmpager-run"
description = "llmpager decode runtime: resident core + paged experts, greedy decode CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
llmpager-core = { path = "../llmpager-core" }
llmpager-cuda = { path = "../llmpager-cuda", features = ["kernels"] }
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }

[[bin]]
name = "llmpager-run"
path = "src/main.rs"
