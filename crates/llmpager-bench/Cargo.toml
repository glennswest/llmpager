[package]
name = "llmpager-bench"
description = "M0 microbenchmarks: NVMe O_DIRECT reads, pinned H2D copies, end-to-end paged expert fetch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
llmpager-core = { path = "../llmpager-core" }
llmpager-cuda = { path = "../llmpager-cuda", optional = true }

[features]
# CUDA path loads libcuda.so.1 at runtime — no toolkit needed on the box.
cuda = ["dep:llmpager-cuda"]
# GPU kernels compiled from CUDA C at build time (needs nvcc).
kernels = ["cuda", "llmpager-cuda/kernels"]

[[bin]]
name = "llmpager-bench"
path = "src/main.rs"
